name: Emulator build (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build emulator-only container (never downloads DSM)
        run: docker build -t pinology:ci kernel/stock-board
      - name: Check models and runtime
        run: |
          docker run --rm --network none --entrypoint /opt/ds223/bin/qemu-system-aarch64 pinology:ci -machine help
          docker run --rm --network none pinology:ci config
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build prerequisites
        run: |
          missing=()
          for formula in meson ninja pkg-config glib libffi gettext dtc qemu gpatch; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              missing+=("$formula")
            fi
          done
          if (( ${#missing[@]} )); then
            brew install "${missing[@]}"
          fi
      - name: Build native emulator and local bundle (never downloads DSM)
        run: ./pinology build
      - name: Verify ad-hoc signature and models
        run: |
          while IFS= read -r -d '' binary; do
            codesign --verify --strict "$binary"
          done < <(find dist/pinology-macos/bin dist/pinology-macos/lib -type f -print0)
          dist/pinology-macos/bin/qemu-system-aarch64 -machine help
    # No artifact/container publication: redistribute only with complete source/notices.
